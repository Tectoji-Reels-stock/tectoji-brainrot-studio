name: Tectoji background runner
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tectoji-state
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Anything due?
        id: chk
        run: python runner.py --check
      - name: Install system packages
        if: steps.chk.outputs.due == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-noto-color-emoji fonts-freefont-ttf fonts-dejavu-core libfribidi0 libraqm0
      - name: Install Python packages
        if: steps.chk.outputs.due == 'true'
        run: pip install pillow numpy piper-tts
      - name: Download Hindi AI voice (Piper)
        if: steps.chk.outputs.due == 'true'
        run: |
          mkdir -p models
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium
          curl -fL -o models/hi_IN-rohan-medium.onnx $B/hi_IN-rohan-medium.onnx || echo "voice download failed"
          curl -fL -o models/hi_IN-rohan-medium.onnx.json $B/hi_IN-rohan-medium.onnx.json || echo "voice config download failed"
      - name: Make and upload due videos
        if: steps.chk.outputs.due == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
          PIXAZO_VIDEO_CLIPS: ${{ vars.PIXAZO_VIDEO_CLIPS || '0' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python runner.py
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.due == 'true'
        with:
          name: videos
          path: out/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save state
        if: steps.chk.outputs.due == 'true'
        run: |
          git config user.name "tectoji-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state update"
          git pull --rebase || true
          git push
